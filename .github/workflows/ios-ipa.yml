name: iOS IPA (sem assinatura)

# Gera um .ipa sem assinatura para instalar com SideStore/AltStore.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Gerar projeto iOS
        run: npx expo prebuild --platform ios

      - name: Compilar (Release, sem assinatura)
        run: |
          set -o pipefail
          xcodebuild \
            -workspace ios/TrackCam.xcworkspace \
            -scheme TrackCam \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            | tail -n 400

      - name: Empacotar .ipa
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/TrackCam.app Payload/
          zip -qr TrackCam.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: TrackCam-ipa
          path: TrackCam.ipa
